version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
    
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend-deps:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      rust-deps:
        patterns:
          - "*"
    # Excluimos las carpetas de investigación/legacy para que no den avisos de seguridad.
    # El workspace activo (Cargo.toml raíz) solo incluye me-60os-core, sentinel-cortex,
    # truthsync-core, sentinel-verifier y services/neural-guard. Todo lo demás en cargo/*
    # son crates legacy fuera del workspace — fuente probable de ruido en Dependabot.
    ignore:
      - dependency-name: "*"
        directories:
          - "/docs/research"
          - "/internal/exploratory"
          - "/experiments"
          - "/backups_traefik"
          - "/temporal"
          - "/history"
          - "/gui/src-tauri"
          - "/src/core"
          - "/src/sentinel-cortex"
          - "/src/sentinel-wasm"
          - "/tools/sctl-rs"
          - "/tools/sip-rs"
          - "/docs/02_ciencia_y_quantum/research"
