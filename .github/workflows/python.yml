name: Python CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest ruff mypy

      - name: Pytest backend
        run: cd backend && pytest -q tests/test_auth_security.py tests/test_telemetry_sanitizer.py
        env:
          PYTHONPATH: backend

      - name: Ruff
        run: ruff check backend/ quantum/

      - name: Mypy
        run: mypy --strict backend/app
        continue-on-error: true
