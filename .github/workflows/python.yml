name: Python CI

on:
  pull_request:
  push:
    branches: ["main", "alpine_fenix"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev

      - name: Build Python native module
        run: |
          cargo build -p me60os --features extension-module --release
          cp target/release/libme60os_core.so quantum/me60os_core.so

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest ruff mypy

      - name: Pytest backend
        run: cd backend && pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend

      - name: Pytest quantum
        run: cd quantum && pytest -q
        continue-on-error: true

      - name: Ruff
        run: ruff check backend/ quantum/

      - name: Mypy
        run: mypy --strict backend/app
        continue-on-error: true
