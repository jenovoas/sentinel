name: eBPF Build CI

on:
  pull_request:
  push:
    branches: ["main", "alpine_fenix"]

jobs:
  ebpf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev libbpf-dev build-essential linux-headers-$(uname -r)

      - name: Build eBPF programs
        run: make -C ebpf

      # Runtime LSM loading mutates privileged kernel state. Verify it on a
      # dedicated target host after loading, not on a generic CI runner.
