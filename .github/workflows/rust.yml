name: Rust CI

on:
  pull_request:
  push:
    branches: ["main", "alpine_fenix"]

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          build-warnings: warn

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev

      - name: Build
        run: cargo build --all --release

      - name: Test
        run: cargo test --all --release
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        # sqlx-mysql is only an optional lockfile entry; sentinel-cortex enables postgres only.
        # RUSTSEC-2023-0071 has no patched release, and `cargo tree -e features -i sqlx-mysql` is empty.
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Deny check
        run: cargo deny check
