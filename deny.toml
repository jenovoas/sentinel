# cargo-deny configuration
# Run: cargo deny check

[advisories]
# Fail on advisories with severity >= medium
yanked = "deny"

[licenses]
# Allow common permissive licenses
allow = [
    # Root LICENSE: Apache-2.0 text with the Commons Clause restriction.
    "LicenseRef-Sentinel-NonCommercial",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
]
# Todo lo no permitido arriba se deniega por defecto (incluye GPL-3,
# incompatible con Apache-2.0). La clave [[licenses.deny]] fue eliminada
# en cargo-deny 0.18 (https://github.com/EmbarkStudios/cargo-deny/pull/611).

[bans]
# Disallow multiple versions of the same crate
multiple-versions = "warn"
