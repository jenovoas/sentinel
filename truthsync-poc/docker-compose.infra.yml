services:
  truth-db:
    image: postgres:16-alpine
    container_name: sentinel-truth-db
    restart: unless-stopped
    networks:
      - truth-internal
    environment:
      - POSTGRES_DB=truth
      - POSTGRES_USER=truth
      - POSTGRES_PASSWORD=sentinel_secret_password
    volumes:
      - truth-postgres:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c random_page_cost=1.1

  truth-redis:
    image: redis:7-alpine
    container_name: sentinel-truth-redis
    restart: unless-stopped
    networks:
      - truth-internal
    command: >
      redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - truth-redis:/data

volumes:
  truth-postgres:
  truth-redis:


networks:
  truth-internal:
    driver: bridge
