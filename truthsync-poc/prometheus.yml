global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['sentinel-node-exporter:9100']
        labels:
          service: 'node_exporter'
          environment: 'production'
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'production'
  
  - job_name: 'truthsync'
    static_configs:
      - targets: ['truthsync:9090']
        labels:
          service: 'truthsync'
          environment: 'production'

