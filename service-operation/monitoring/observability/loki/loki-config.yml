# Loki Configuration for Dual-Lane Architecture
# Security Lane: Strict ordering, 2-year retention
# Observability Lane: 2s out-of-order tolerance, 30-day retention

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# DUAL-LANE CONFIGURATION
limits_config:
  # Global limits
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 200
  max_streams_per_user: 10000
  max_global_streams_per_user: 50000
  
  # Global ingestion robustness
  out_of_order_time_window: 10s
  
  # Security Lane: STRICT ordering (no tolerance)
  # Observability Lane: 2s out-of-order tolerance
  # This is applied per-stream based on labels
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  
  # Per-tenant limits (can be overridden per stream)
  per_stream_rate_limit: 50MB
  per_stream_rate_limit_burst: 100MB
  
  # Cardinality limits
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30

# Stream-specific configuration via overrides
# This allows different behavior for security vs observability lanes
overrides:
  # Default tenant (all streams)
  "fake":
    # Observability lane: Allow out-of-order within 10s window (relaxed)
    # Security lane: Still falls under tenant default, but since it's 0ms batch, risk is low.
    # Note: Loki doesn't support per-label out_of_order_time_window easily in unified tenant.
    out_of_order_time_window: 10s
    
    # Retention policies by stream selector
    retention_stream:
      # Security Lane: 2 years (compliance)
      - selector: '{lane="security"}'
        priority: 1
        period: 17520h  # 730 days = 2 years
      
      # Observability Lane: 30 days (operational)
      - selector: '{lane="ops"}'
        priority: 2
        period: 720h    # 30 days

# Compactor for retention enforcement
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Query limits
query_range:
  max_query_length: 721h  # 30 days + 1 hour
  max_query_parallelism: 32
  cache_results: true

# Ruler for alerts (optional)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

# Table manager for retention
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h  # Default 30 days (overridden by stream retention)

# Analytics
analytics:
  reporting_enabled: false
