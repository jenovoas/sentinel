global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: securepenguin
    environment: production
    node: marte

remote_write:
  - url: http://mimir:9009/api/v1/push

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter-marte
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          node: marte

  - job_name: sentinel-fastapi-fenix
    metrics_path: /metrics
    static_configs:
      - targets: ["10.88.0.1:8000"]
        labels:
          node: fenix
          service: sentinel-backend

  - job_name: sentinel-cortex-fenix
    metrics_path: /metrics
    static_configs:
      - targets: ["10.88.0.1:8001"]
        labels:
          node: fenix
          service: sentinel-cortex
