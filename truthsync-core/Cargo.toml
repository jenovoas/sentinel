[package]
name = "truthsync-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "truthsync_core"
path = "src/lib.rs"

[dependencies]
aho-corasick = "1.1"
regex = "1.10"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
me60os_core = { path = "../me-60os-core", package = "me60os" }
