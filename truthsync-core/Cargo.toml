[package]
name = "truthsync-core"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Sentinel-NonCommercial"

[lib]
name = "truthsync_core"
path = "src/lib.rs"

[dependencies]
aho-corasick = "1.1"
regex = "1.10"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.12"
me60os_core = { path = "../me-60os-core", package = "me60os" }
lru = "0.19"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "truthsync_bench"
harness = false

[[bin]]
name = "truthsync_1m_bench"
path = "src/bin/truthsync_1m_bench.rs"
