# SOMA: Inventario de Infraestructura
# Contexto estructurado para consulta por agentes

metadata:
  version: "1.0.0"
  last_updated: "2026-02-26T00:00:00Z"

# Nodos del clúster
nodes:
  - id: "fenix"
    fqdn: "fenix.pinguinoseguro.cl"
    ip: "10.10.10.8"
    role: "orchestrator"
    os: "Rocky Linux 9"
    services:
      - podman
      - traefik
      - powerdns
      - ebpf
      - lsm
      - xdp
    status: "online"

# Contenedores Podman
containers:
  - name: "postgres"
    image: "postgres:16"
    status: "running"
    ports: ["5432:5432"]
    volumes:
      - "/data/postgres:/var/lib/postgresql/data"
    health_check: "pg_isready -U postgres"
    node: "fenix"

  - name: "redis"
    image: "redis:7-alpine"
    status: "running"
    ports: ["6379:6379"]
    volumes:
      - "/data/redis:/data"
    health_check: "redis-cli ping"
    node: "fenix"

  - name: "backend"
    image: "sentinel-backend:latest"
    status: "running"
    ports: ["8000:8000"]
    depends_on: ["postgres", "redis"]
    node: "fenix"

  - name: "frontend"
    image: "sentinel-frontend:latest"
    status: "running"
    ports: ["3000:3000"]
    depends_on: ["backend"]
    node: "fenix"

  - name: "observability"
    image: "sentinel-observability:latest"
    status: "running"
    ports: ["9090:9090"]
    depends_on: ["postgres", "redis"]
    node: "fenix"

  - name: "quantum"
    image: "sentinel-quantum:latest"
    status: "running"
    ports: ["8080:8080"]
    depends_on: ["postgres"]
    node: "fenix"

  - name: "cortex"
    image: "sentinel-cortex:latest"
    status: "running"
    ports: ["5000:5000"]
    depends_on: ["postgres"]
    node: "fenix"

# Redes
networks:
  - name: "sentinel-net"
    driver: "bridge"
    subnet: "10.100.0.0/24"
    nodes: ["fenix"]
    status: "active"

# Volúmenes
volumes:
  - name: "postgres-data"
    path: "/data/postgres"
    size: "10G"
    node: "fenix"

  - name: "redis-data"
    path: "/data/redis"
    size: "1G"
    node: "fenix"

  - name: "ebpf-maps"
    path: "/sys/fs/bpf/sentinel"
    size: "100M"
    node: "sentinel"

  - name: "quantum-state"
    path: "/data/quantum"
    size: "5G"
    node: "fenix"

# Certificados SSL
certificates:
  - domain: "*.pinguinoseguro.cl"
    type: "wildcard"
    issuer: "traefik"
    provider: "dns-01 (RFC2136)"
    expires: "2026-05-26"
    node: "fenix"
    status: "valid"

# Reglas de firewall
firewall:
  - rule: "allow_traefik"
    source: "10.10.10.8"
    port: "80,443"
    action: "accept"
    status: "enabled"

  - rule: "allow_postgres"
    source: "10.10.10.0/24"
    port: "5432"
    action: "accept"
    status: "enabled"

  - rule: "allow_redis"
    source: "10.10.10.0/24"
    port: "6379"
    action: "accept"
    status: "enabled"

  - rule: "block_all"
    source: "0.0.0.0/0"
    port: "all"
    action: "drop"
    status: "enabled"

# Reglas auditd
auditd:
  config_path: "/etc/audit/auditd.conf"
  rules_path: "/etc/audit/rules.d/sentinel.rules"
  status: "active"
  rules:
    - category: "ebpf"
      syscall: "bpf"
      action: "audit"
    - category: "lsm"
      syscall: "security_file_permission"
      action: "audit"
    - category: "xdp"
      syscall: "setsockopt"
      action: "audit"
    - category: "systemd"
      path: "/etc/systemd/system"
      action: "audit"

# Servicios Systemd
systemd:
  - name: "sentinel-lsm.service"
    description: "Sentinel LSM Hook"
    path: "/etc/systemd/system/sentinel-lsm.service"
    enabled: true
    watchdog_sec: 30
    status: "loaded"

  - name: "sentinel-xdp.service"
    description: "Sentinel XDP Hook"
    path: "/etc/systemd/system/sentinel-xdp.service"
    enabled: true
    watchdog_sec: 30
    status: "loaded"

  - name: "sentinel-auditd.service"
    description: "Sentinel Auditd Watchdog"
    path: "/etc/systemd/system/sentinel-auditd.service"
    enabled: false
    watchdog_sec: 60
    status: "loaded"

# Configuración DNS
dns:
  provider: "PowerDNS"
  node: "fenix"
  api_url: "http://10.10.10.8:8081/api/v1"
  api_key: "CHANGEME"
  zone: "pinguinoseguro.cl"
  records:
    - name: "cortex"
      type: "A"
      value: "10.10.10.8"
      status: "active"
    - name: "grafana"
      type: "A"
      value: "10.10.10.8"
      status: "active"
