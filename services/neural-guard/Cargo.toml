[package]
name = "neural-guard"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Sentinel-NonCommercial"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
redis = { version = "1.6", features = ["tokio-comp"] }
me60os_core = { path = "../../me-60os-core", package = "me60os" }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
