[package]
name = "deployment-orchestrator"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Sentinel-NonCommercial"

[dependencies]
aes-gcm = "0.11"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "net", "time", "process", "signal"] }
tokio-postgres = "0.7"
libc = "0.2"
native-tls = "0.2"
postgres-native-tls = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.7", features = ["v4"] }

[build-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"
