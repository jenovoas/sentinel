version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: sentinel-n8n
    restart: unless-stopped
    userns_mode: keep-id   # Fix: mapeo correcto de UID en Podman rootless
    ports:
      - "5678:5678"
    environment:
      # Basic Auth
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=jaime.novoase@gmail.com
      - N8N_BASIC_AUTH_PASSWORD=Eyedol2119!.

      # Directorio de datos (debe coincidir con el UID del host en rootless)
      - N8N_USER_FOLDER=/home/jnovoas/.n8n

      # Webhook URL
      - WEBHOOK_URL=http://localhost:5678/

      # Encryption
      - N8N_ENCRYPTION_KEY=sentinel_encryption_key_change_in_production

      # Timezone
      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago

      # Execution
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true

    volumes:
      - n8n_data:/home/jnovoas/.n8n   # Ruta coincide con N8N_USER_FOLDER y UID del host

    networks:
      - sentinel-network

volumes:
  n8n_data:
    driver: local

networks:
  sentinel-network:
    external: true
