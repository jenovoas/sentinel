# Prometheus Configuration - Sentinel v2.2
# Updated: 2026-03-02

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'securepenguin'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporters - Por nodo via WireGuard VPN
  - job_name: 'node-exporter-kingu'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.10.10.1:9100']
        labels:
          node: 'kingu'
          role: 'pdc'
          network: 'vpn'

  - job_name: 'node-exporter-sentinel'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.10.10.2:9100']
        labels:
          node: 'sentinel'
          role: 'bdc'
          network: 'vpn'

  - job_name: 'node-exporter-centurion'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.10.10.3:9100']
        labels:
          node: 'centurion'
          role: 'gateway'
          network: 'vpn'

  - job_name: 'node-exporter-fenix'
    scrape_interval: 15s
    static_configs:
      - targets: ['10.10.10.8:9100']
        labels:
          node: 'fenix'
          role: 'development'
          network: 'vpn'

  # Database Exporters
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres-db'
          node: 'sentinel'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis-cache'
          node: 'sentinel'

  # Swarm & Application
  - job_name: 'swarm_enjambre'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.10.10.8:9122', '10.10.10.2:9122']
        labels:
          service: 'swarm-exporter'

  - job_name: 'backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend-api'

  - job_name: 'blackbox-external'
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://pinguinoseguro.cl
        labels:
          group: 'external-http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '10.10.10.2:9115'
  - job_name: 'blackbox-http'
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://10.10.10.2:3001  # Grafana
          - http://10.10.10.2:9090  # Prometheus
          - http://10.10.10.2:5678  # n8n
          - http://10.10.10.8:80    # fenix web
        labels:
          group: 'internal-http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '10.10.10.2:9115'
