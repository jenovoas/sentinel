# Prometheus Configuration - Fenix Server (single-node)
# Actualizado: 2026-03-21

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'fenix'
    environment: 'production'

rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          node: 'fenix'

  - job_name: 'node-exporter-fenix'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: 'fenix'
          role: 'development'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres-db'
          node: 'fenix'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis-cache'
          node: 'fenix'

  - job_name: 'sentinel-cortex'
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['cortex.pinguinoseguro.cl:443']
        labels:
          service: 'sentinel-cortex'
          node: 'fenix'
