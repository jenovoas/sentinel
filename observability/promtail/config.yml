server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          node: fenix
          __path__: /var/log/messages
      - targets:
          - localhost
        labels:
          job: syslog
          node: fenix
          __path__: /var/log/secure
      - targets:
          - localhost
        labels:
          job: syslog
          node: fenix
          __path__: /var/log/sentinel/*.log
      - targets:
          - localhost
        labels:
          job: syslog
          node: fenix
          __path__: /var/log/audit/audit.log