apiVersion: 1

datasources:
- name: Prometheus
  type: prometheus
  uid: prometheus
  access: proxy
  url: http://prometheus:9090
  isDefault: true

- name: Loki
  type: loki
  uid: loki
  access: proxy
  url: http://loki:3100
  isDefault: false

- name: PostgreSQL
  type: postgres
  uid: postgres
  access: proxy
  url: postgres:5432
  user: sentinel
  secureJsonData:
    password: sentinel_staging_password
  jsonData:
    database: sentinel_staging
    sslmode: disable
    postgresVersion: 15
