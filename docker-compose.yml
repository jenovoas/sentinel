services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_default_secure_pass}
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sentinel_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinel-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-vault-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - vault_data:/app/storage
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:${POSTGRES_PASSWORD:-darkfenix}@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel-net
    security_opt:
      - "seccomp=./seccomp/app-hardened.json"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-vault-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sentinel-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:stable-alpine
    container_name: sentinel-vault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sentinel-net

  # Node Exporter for Hardware and Kernel Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sentinel-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.perf'
      - '--collector.perf.cpus=0-7'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    cap_add:
      - SYS_ADMIN
    networks:
      - sentinel-net

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: sentinel-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - sentinel-net

  # Promtail - Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: sentinel-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vault_data:


