[package]
name = "me60os"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "me60os_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "debug_s60"
path = "src/main.rs"

[[bin]]
name = "soma-orchestrator"
path = "src/soma_orchestrator.rs"

[[bin]]
name = "soma-worker"
path = "src/soma_worker.rs"

[[bin]]
name = "fpu_vs_pai_bench"
path = "src/bin/fpu_vs_pai_bench.rs"

[[bin]]
name = "resonant_lattice_memory"
path = "src/bin/resonant_lattice_memory.rs"

[dependencies]
libc = "0.2"
# pyo3 made optional to allow pure Rust binary builds
pyo3 = { version = "0.29", optional = true }
regex = "1.10"
memmap2 = "0.9"
rayon = "1.10"
rand = "0.8"
libbpf-rs = "0.24"
once_cell = "1.19"
phf = { version = "0.11", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
ratatui = "0.30.2"
crossterm = { version = "0.27", features = ["events"] }
anyhow = "1.0"
chrono = "0.4"
flate2 = "1.1.9"
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
aes-gcm = "0.10"
blake3 = "1.5"

[features]
extension-module = ["pyo3/extension-module", "pyo3"]
default = ["extension-module"]

# [lints.clippy] — TEMPORARILY DOWNGRADED for clippy verification of dependents
# RESTORED by clippy fix pipeline — DO NOT COMMIT AS IS
[lints.clippy]
float_arithmetic = "warn"
float_cmp = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
