# ==================================================================================
# docker-compose.fenix.yml — Stack Sentinel para Producción en Fenix (DEPURADO)
# ==================================================================================

services:
  # ── BASE DE DATOS ──────────────────────────────────────────────────────────────

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - sentinel_internal
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        mode: host
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}",
        ]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sentinel-redis
    volumes:
      - redis_data:/data
    networks:
      - sentinel_internal
    ports:
      - target: 6379
        published: "6379"
        host_ip: 127.0.0.1
        mode: host
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Cortex runs as the native Alpine/OpenRC daemon. The container is intentionally omitted
  # to avoid binding a second process to :8000 and to preserve direct eBPF/SHM access.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://cortex.pinguinoseguro.cl/api
    networks:
      - sentinel_internal
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    ports:
      - target: 3000
        published: "3100"
        host_ip: 127.0.0.1
        mode: host

    # Nginx del host publica cortex.pinguinoseguro.cl.
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ── OBSERVABILIDAD ─────────────────────────────────────────────────────────────

  prometheus:
    image: docker.io/prom/prometheus:v2.51.2
    container_name: sentinel-prometheus
    volumes:
      - ./observability/prometheus/prometheus.fenix.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    networks:
      - sentinel_internal
    ports:
      - target: 9090
        published: "9090"
        host_ip: 127.0.0.1
        mode: host

    # Nginx aplica TLS y autenticación básica.
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.1
    container_name: sentinel-node-exporter
    pid: host
    volumes:
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sentinel-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.59.0
    container_name: sentinel-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      - redis
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:10.4.2
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/grafana.fenix.ini:/etc/grafana/grafana.ini:ro,z
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
    networks:
      - sentinel_internal
    ports:
      - target: 3000
        published: "3001"
        host_ip: 127.0.0.1
        mode: host

    # Nginx del host termina TLS.
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.0.0
    container_name: sentinel-loki
    volumes:
      - ./observability/loki/config.yml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki
    networks:
      - sentinel_internal
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:3.0.0
    container_name: sentinel-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro,z
    networks:
      - sentinel_internal
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # ── SITIOS WEB ADICIONALES ───────────────────────────────────────────────────



  # ── AUTOMATIZACIÓN ───────────────────────────────────────────────────────────

  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: sentinel-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    networks:
      - sentinel_internal
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  n8n:
    image: docker.io/n8nio/n8n:1.41.0
    container_name: sentinel-n8n
    hostname: n8n
    env_file:
      - .env
    environment:
      - N8N_HOST=n8n.pinguinoseguro.cl
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.pinguinoseguro.cl/
      - N8N_EDITOR_BASE_URL=https://n8n.pinguinoseguro.cl/
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago
      - N8N_EMAIL_MODE=smtp
      - N8N_SMTP_HOST=host.docker.internal
      - N8N_SMTP_PORT=25
      - N8N_SMTP_SENDER=n8n@pinguinoseguro.cl
      - N8N_SMTP_SSL=false
    volumes:
      - ./docker/n8n/workflows:/tmp/workflows:ro,z
      - ./docker/n8n/init-workflows.sh:/docker-entrypoint-init.d/init-workflows.sh:ro,z
      - n8n_data:/home/node/.n8n
    networks:
      - sentinel_internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 5678
        published: "5678"
        host_ip: 127.0.0.1
        mode: host

    # Nginx del host publica n8n.
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  # ── NERVIO COGNITIVO (Neural Guard) ─────────────────────────────────────────

  neural-guard:
    build:
      context: .
      dockerfile: services/neural-guard/Dockerfile
    container_name: sentinel-neural-guard
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PROMETHEUS_URL=http://sentinel-prometheus:9090
      - LOKI_URL=http://sentinel-loki:3100
      - N8N_URL=https://n8n.pinguinoseguro.cl
      - RUST_LOG=info
    env_file:
      - .env
    depends_on:
      - redis
      - prometheus
      - loki
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  n8n_data:

networks:
  sentinel_internal:
    driver: bridge
