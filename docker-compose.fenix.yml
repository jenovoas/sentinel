# ==================================================================================
# docker-compose.fenix.yml — Stack Sentinel para Producción en Fenix (DEPURADO)
# ==================================================================================

services:
  # ── BASE DE DATOS ──────────────────────────────────────────────────────────────

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    env_file:
      - /etc/sentinel/backend.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - sentinel_internal
    ports:
      - target: 5432
        published: "5432"
        host_ip: 127.0.0.1
        mode: host
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}",
        ]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sentinel-redis
    volumes:
      - redis_data:/data
    networks:
      - sentinel_internal
    ports:
      - target: 6379
        published: "6379"
        host_ip: 127.0.0.1
        mode: host
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    env_file:
      - /etc/sentinel/backend.env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # FastAPI backend: reachable by Kingu only over the Fenix WireGuard address.
  backend:
    image: ${SENTINEL_BACKEND_IMAGE:-sentinel-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-backend
    env_file:
      - /etc/sentinel/backend.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: ${SENTINEL_REDIS_URL:?Set the approved Sentinel Redis URL in backend.env}
      FASTAPI_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en el .env de Fenix}
      JWT_ISSUER: ${JWT_ISSUER:-sentinel-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sentinel-cortex}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    extra_hosts:
      - "fenix.pinguinoseguro.cl:172.23.0.1"
    volumes:
      - /usr/local/share/ca-certificates/pinguinoseguro-ad-ldap-ca.crt:/etc/ssl/certs/pinguinoseguro-ad-ldap-ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal
      - backend_egress
      - ad_ldap
    ports:
      - target: 8000
        published: "${SENTINEL_BACKEND_PORT:-8000}"
        host_ip: ${FENIX_WIREGUARD_IP:?Configura la IP WireGuard de Fenix en .env}
        protocol: tcp
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  # ── CORTEX (Axum/Rust), interno en Fenix ────────────────────────────────────────

  cortex:
    image: ${SENTINEL_CORTEX_IMAGE:-sentinel-cortex:latest}
    container_name: sentinel-cortex
    env_file:
      - /etc/sentinel/backend.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: ${SENTINEL_REDIS_URL:?Set the approved Sentinel Redis URL in backend.env}
      RUST_LOG: info
      SENTINEL_PORT: "8000"
      SENTINEL_CRYSTAL_RUNTIME: "1"
      SENTINEL_CRYSTAL_STATE_DIR: /var/lib/sentinel/crystal-state
      SECRET_KEY: ${SECRET_KEY}
      SENTINEL_JWT_SECRET: ${SECRET_KEY:?Configura SECRET_KEY en el .env de Fenix}
      SENTINEL_JWT_ISSUER: ${JWT_ISSUER:-sentinel-auth}
      SENTINEL_JWT_AUDIENCE: ${JWT_AUDIENCE:-sentinel-cortex}
      SENTINEL_WS_ALLOWED_ORIGINS: ${SENTINEL_WS_ALLOWED_ORIGINS:?Define el origen HTTPS de Kingu en el .env de Fenix}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal
      - backend_egress
    ports:
      - target: 8000
        published: "${SENTINEL_CORTEX_PORT:-8001}"
        host_ip: ${FENIX_WIREGUARD_IP:?Configura la IP WireGuard de Fenix en .env}
        protocol: tcp
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rw
      - /dev/shm:/dev/shm:rw
      - /run/soma:/run/soma:ro
      - crystal_state:/var/lib/sentinel/crystal-state
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ── OBSERVABILIDAD ─────────────────────────────────────────────────────────────

  prometheus:
    image: docker.io/prom/prometheus:v2.51.2
    container_name: sentinel-prometheus
    volumes:
      - ./observability/prometheus/prometheus.fenix.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    networks:
      - sentinel_internal
    ports:
      - target: 9090
        published: "9090"
        host_ip: 127.0.0.1
        mode: host

    # Nginx aplica TLS y autenticación básica.
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.1
    container_name: sentinel-node-exporter
    pid: host
    volumes:
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sentinel-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.59.0
    container_name: sentinel-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      - redis
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:10.4.2
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    env_file:
      - /etc/sentinel/backend.env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/grafana.fenix.ini:/etc/grafana/grafana.ini:ro,z
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
    networks:
      - sentinel_internal
    ports:
      - target: 3000
        published: "3001"
        host_ip: 127.0.0.1
        mode: host

    # Nginx del host termina TLS.
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.0.0
    container_name: sentinel-loki
    volumes:
      - ./observability/loki/config.yml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki
    networks:
      - sentinel_internal
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - target: 3100
        published: "3100"
        host_ip: 127.0.0.1
        mode: host
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:3.0.0
    container_name: sentinel-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro,z
    networks:
      - sentinel_internal
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # ── SITIOS WEB ADICIONALES ───────────────────────────────────────────────────



  # ── AUTOMATIZACIÓN ───────────────────────────────────────────────────────────

  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: sentinel-alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager_data:/alertmanager
    networks:
      - sentinel_internal
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  n8n:
    image: n8nio/n8n@sha256:eedb51a7ef93aef188897447aa83e993e132106b9590c054ecec3440ba90ab67
    container_name: sentinel-n8n
    hostname: n8n
    env_file:
      - /etc/sentinel/n8n.env
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sentinel_internal
      - backend_egress
    ports:
      - target: 5678
        published: "5678"
        host_ip: ${FENIX_WIREGUARD_IP:?Set FENIX_WIREGUARD_IP in /etc/sentinel/backend.env}
        protocol: tcp
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  # ── NERVIO COGNITIVO (Neural Guard) ─────────────────────────────────────────

  neural-guard:
    build:
      context: .
      dockerfile: services/neural-guard/Dockerfile
    container_name: sentinel-neural-guard
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PROMETHEUS_URL=http://sentinel-prometheus:9090
      - LOKI_URL=http://sentinel-loki:3100
      - N8N_URL=https://n8n.pinguinoseguro.cl
      - RUST_LOG=info
    env_file:
      - /etc/sentinel/backend.env
    depends_on:
      - redis
      - prometheus
      - loki
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  n8n_data:
  crystal_state:

networks:
  sentinel_internal:
    driver: bridge
    internal: true
  backend_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
  ad_ldap:
    name: sentinel_ad_ldap
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.name: br-sentad
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1
  proxy:
    external: true
