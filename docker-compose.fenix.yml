# ==================================================================================
# docker-compose.fenix.yml — Stack Sentinel para Producción en Fenix
# ==================================================================================
# Diferencias vs docker-compose.yml (desarrollo):
#   ✅ Sin Nginx — Traefik es el único proxy (ya corre como servicio systemd)
#   ✅ Sin puertos internos expuestos al host (postgres, redis, prometheus)
#   ✅ Backend en modo producción (sin --reload, sin bind mount de código fuente)
#   ✅ Redis con requirepass
#   ✅ Grafana sin auth anónima, password segura
#   ✅ Red "proxy" externa conectada a Traefik
#   ✅ Servicios de BD en red interna sin acceso al exterior
#
# Uso:
#   podman-compose -f docker-compose.fenix.yml up -d
#
# Variables requeridas en .env.fenix:
#   POSTGRES_PASSWORD, REDIS_PASSWORD, SECRET_KEY,
#   GF_ADMIN_PASSWORD, N8N_PASSWORD
# ==================================================================================

services:

  # ── BASE DE DATOS ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # REQUERIDO — sin default
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - sentinel_internal                            # Solo red interna, SIN acceso exterior
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Seguridad: solo raíz de datos accesible
    read_only: false
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    volumes:
      - redis_data:/data
    networks:
      - sentinel_internal                            # Solo red interna
    # requirepass obligatorio en producción
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── BACKEND FASTAPI ────────────────────────────────────────────────────────────

  backend:
    image: ghcr.io/jnovoas/sentinel-backend:latest   # Imagen pre-construida (no bind mount)
    container_name: sentinel-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FASTAPI_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: https://sentinel.pinguinoseguro.cl,https://pinguinoseguro.cl
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-gen-lang-client-0933512124}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.0-flash-001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /home/jnovoas/.config/gcloud/application_default_credentials.json:/app/credentials.json:ro
    networks:
      - sentinel_internal
      - proxy                                        # Conectado a Traefik para enrutamiento
    # Sin puerto expuesto al host — Traefik enruta internamente
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-api.rule=Host(`sentinel-api.pinguinoseguro.cl`)"
      - "traefik.http.routers.sentinel-api.entrypoints=websecure"
      - "traefik.http.routers.sentinel-api.tls.certresolver=powerdns"
      - "traefik.http.services.sentinel-api.loadbalancer.server.port=8000"
      # Redirect HTTP → HTTPS
      - "traefik.http.routers.sentinel-api-http.rule=Host(`sentinel-api.pinguinoseguro.cl`)"
      - "traefik.http.routers.sentinel-api-http.entrypoints=web"
      - "traefik.http.routers.sentinel-api-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── WORKERS CELERY ─────────────────────────────────────────────────────────────

  celery_worker:
    image: ghcr.io/jnovoas/sentinel-backend:latest
    container_name: sentinel-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal
    command: celery -A app.celery_app worker --loglevel=warning --concurrency=2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  celery_beat:
    image: ghcr.io/jnovoas/sentinel-backend:latest
    container_name: sentinel-celery-beat
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sentinel_internal
    command: celery -A app.celery_app beat --loglevel=warning
    restart: unless-stopped

  # ── OBSERVABILIDAD ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - sentinel_internal
      - proxy
    # Sin puerto expuesto — solo accesible vía Traefik con auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.pinguinoseguro.cl`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=powerdns"
      - "traefik.http.routers.prometheus.middlewares=prometheus-auth"
      - "traefik.http.middlewares.prometheus-auth.basicauth.usersfile=/run/secrets/prometheus_htpasswd"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: sentinel-loki
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - sentinel_internal                            # Solo interno — no expuesto
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: sentinel-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro  # Podman socket rootless
    networks:
      - sentinel_internal
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}           # REQUERIDO
      GF_SERVER_ROOT_URL: https://grafana.pinguinoseguro.cl
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      # Producción: sin acceso anónimo
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.pinguinoseguro.cl`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=powerdns"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ── N8N AUTOMACIONES ───────────────────────────────────────────────────────────

  n8n:
    image: n8nio/n8n:latest
    container_name: sentinel-n8n
    environment:
      GENERIC_TIMEZONE: America/Santiago
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}          # REQUERIDO
      N8N_HOST: n8n.pinguinoseguro.cl
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.pinguinoseguro.cl/
      N8N_EDITOR_BASE_URL: https://n8n.pinguinoseguro.cl/
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_API_KEY_REQUIRED: "true"                      # En producción: API key requerida
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.pinguinoseguro.cl`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=powerdns"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: sentinel-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - sentinel_internal                            # Solo interno — Prometheus lo scrape internamente
    pid: host
    restart: unless-stopped

# ── VOLÚMENES ──────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local
  n8n_data:
    driver: local

# ── REDES ──────────────────────────────────────────────────────────────────────

networks:
  # Red interna: servicios de BD y workers — SIN acceso a internet
  sentinel_internal:
    driver: bridge
    internal: true                                   # Aislada del exterior

  # Red compartida con Traefik — solo servicios que necesitan enrutamiento HTTP
  proxy:
    external: true                                   # Creada por Traefik (podman network create proxy)
