# ==================================================================================
# docker-compose.fenix.yml — Stack Sentinel para Producción en Fenix (DEPURADO)
# ==================================================================================

services:

  # ── BASE DE DATOS ──────────────────────────────────────────────────────────────

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - sentinel_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sentinel-redis
    volumes:
      - redis_data:/data
    networks:
      - sentinel_internal
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ── CORTEX NATIVO (Axum/Rust) ──────────────────────────────────────────────────

  cortex:
    build: 
      context: ./sentinel-cortex
      dockerfile: Dockerfile
    container_name: sentinel-cortex
    shm_size: 256mb
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cortex.rule=Host(`sentinel.pinguinoseguro.cl`)"
      - "traefik.http.routers.cortex.entrypoints=websecure"
      - "traefik.http.routers.cortex.tls.certresolver=powerdns"
      - "traefik.http.services.cortex.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ── WORKERS CELERY ─────────────────────────────────────────────────────────────


  # ── OBSERVABILIDAD ─────────────────────────────────────────────────────────────

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: sentinel-prometheus
    volumes:
      - ./observability/prometheus/prometheus.fenix.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.pinguinoseguro.cl`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=powerdns"
      - "traefik.http.middlewares.monitor-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$2y$$05$$dSKcd.QFwH0t8tzu9fLCNO0AxrI78yBAwn3pSbY90chb4.wN8DEgO}"
      - "traefik.http.routers.prometheus.middlewares=monitor-auth"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: sentinel-node-exporter
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: sentinel-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:latest
    container_name: sentinel-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      - redis
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/grafana.fenix.ini:/etc/grafana/grafana.ini:ro,z
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.pinguinoseguro.cl`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=powerdns"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  web-server:
    image: docker.io/nginx:alpine
    container_name: sentinel-web
    volumes:
      - /home/jnovoas/www:/usr/share/nginx/html:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`dev.pinguinoseguro.cl`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=powerdns"
      - "traefik.http.middlewares.monitor-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$2y$$05$$dSKcd.QFwH0t8tzu9fLCNO0AxrI78yBAwn3pSbY90chb4.wN8DEgO}"
      - "traefik.http.routers.web.middlewares=monitor-auth"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  sentinel_internal:
    driver: bridge
    internal: true
  proxy:
    external: true
