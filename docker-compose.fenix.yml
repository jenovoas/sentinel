# ==================================================================================
# docker-compose.fenix.yml — Stack Sentinel para Producción en Fenix (DEPURADO)
# ==================================================================================

services:
  # ── BASE DE DATOS ──────────────────────────────────────────────────────────────

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - sentinel_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}",
        ]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: sentinel-redis
    volumes:
      - redis_data:/data
    networks:
      - sentinel_internal
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ── CORTEX NATIVO (Axum/Rust) ──────────────────────────────────────────────────

  cortex:
    build:
      context: ./sentinel-cortex
      dockerfile: Dockerfile
    container_name: sentinel-cortex
    shm_size: 256mb
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RUST_LOG: info
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cortex-api.rule=Host(`cortex.pinguinoseguro.cl`) && PathPrefix(`/api`)"
      - "traefik.http.routers.cortex-api.entrypoints=websecure"
      - "traefik.http.routers.cortex-api.tls.certresolver=powerdns"
      - "traefik.http.routers.cortex-api.middlewares=cortex-api-strip"
      - "traefik.http.middlewares.cortex-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.cortex-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://cortex.pinguinoseguro.cl/api
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cortex-ui.rule=Host(`cortex.pinguinoseguro.cl`)"
      - "traefik.http.routers.cortex-ui.entrypoints=websecure"
      - "traefik.http.routers.cortex-ui.tls.certresolver=powerdns"
      - "traefik.http.services.cortex-ui.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ── OBSERVABILIDAD ─────────────────────────────────────────────────────────────

  prometheus:
    image: docker.io/prom/prometheus:v2.51.2
    container_name: sentinel-prometheus
    volumes:
      - ./observability/prometheus/prometheus.fenix.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus_data:/prometheus
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.pinguinoseguro.cl`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=powerdns"
      - "traefik.http.middlewares.monitor-auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"
      - "traefik.http.routers.prometheus.middlewares=monitor-auth"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.1
    container_name: sentinel-node-exporter
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sentinel-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-sentinel_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.59.0
    container_name: sentinel-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      - redis
    networks:
      - sentinel_internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:10.4.2
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/grafana.fenix.ini:/etc/grafana/grafana.ini:ro,z
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.pinguinoseguro.cl`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=powerdns"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.0.0
    container_name: sentinel-loki
    volumes:
      - ./observability/loki/config.yml:/etc/loki/local-config.yaml:ro,z
      - loki_data:/loki
    networks:
      - sentinel_internal
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  promtail:
    image: docker.io/grafana/promtail:3.0.0
    container_name: sentinel-promtail
    volumes:
      - /var/log:/var/log:ro
      - /run/log/journal:/run/log/journal:ro
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro,z
    networks:
      - sentinel_internal
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # ── SITIOS WEB ADICIONALES ───────────────────────────────────────────────────

  portfolio_web:
    image: docker.io/nginx:1.25-alpine
    container_name: sentinel-portfolio-web
    volumes:
      - /home/jnovoas/Desarrollo/portfolio:/usr/share/nginx/html:ro,z
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`portfolio.pinguinoseguro.cl`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=powerdns"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  laespiguita_web:
    image: docker.io/nginx:1.25-alpine
    container_name: sentinel-laespiguita-web
    volumes:
      - /home/jnovoas/Desarrollo/laespiguita:/usr/share/nginx/html:ro,z
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laespiguita.rule=Host(`laespiguita.pinguinoseguro.cl`)"
      - "traefik.http.routers.laespiguita.entrypoints=websecure"
      - "traefik.http.routers.laespiguita.tls.certresolver=powerdns"
      - "traefik.http.services.laespiguita.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  # ── AUTOMATIZACIÓN ───────────────────────────────────────────────────────────

  n8n:
    image: docker.io/n8nio/n8n:1.41.0
    container_name: sentinel-n8n
    hostname: n8n
    environment:
      - N8N_HOST=n8n.pinguinoseguro.cl
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.pinguinoseguro.cl/
      - N8N_EDITOR_BASE_URL=https://n8n.pinguinoseguro.cl/
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago
      # # --- Configuración SMTP (Fase 2) - Comentado temporalmente para depuración ---
      # - N8N_EMAIL_MODE=smtp
      # - N8N_SMTP_HOST=smtp.pinguinoseguro.cl
      # - N8N_SMTP_PORT=587
      # - N8N_SMTP_USER=${SMTP_USER}
      # - N8N_SMTP_PASS=${SMTP_PASSWORD}
      # - N8N_SMTP_SENDER=n8n@pinguinoseguro.cl
      # - N8N_SMTP_SSL=false
    volumes:
      - ./docker/n8n/workflows:/tmp/workflows:ro,z
      - ./docker/n8n/init-workflows.sh:/docker-entrypoint-init.d/init-workflows.sh:ro,z
      - n8n_data:/home/node/.n8n
    networks:
      - sentinel_internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.pinguinoseguro.cl`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=powerdns"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.docker.network=proxy"
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  n8n_data:

networks:
  sentinel_internal:
    driver: bridge
    internal: true
  proxy:
    external: true
