theme: dark
server:
  address: 'tcp://:9091/authelia'
log:
  level: info
authentication_backend:
  ldap:
    address: 'ldaps://fenix.pinguinoseguro.cl:636'
    tls:
      skip_verify: true
    base_dn: 'DC=pinguinoseguro,DC=cl'
    user: 'CN=svc-authelia-bind,CN=Users,DC=pinguinoseguro,DC=cl'
    users_filter: '(&(|({username_attribute}={input})(userPrincipalName={input})(mail={input}))(objectClass=person))'
    username_attribute: 'sAMAccountName'
    groups_filter: '(&(member={dn})(objectClass=group))'
    group_name_attribute: 'cn'
access_control:
  default_policy: 'deny'
  rules:
    - domain: 'n8n.pinguinoseguro.cl'
      policy: 'one_factor'
      subject: 'group:SP-N8N-Flows'
session:
  cookies:
    - domain: 'n8n.pinguinoseguro.cl'
      authelia_url: 'https://n8n.pinguinoseguro.cl/authelia'
      default_redirection_url: 'https://n8n.pinguinoseguro.cl/'
  expiration: '1h'
  inactivity: '5m'
storage:
  local:
    path: '/config/db.sqlite3'
notifier:
  filesystem:
    filename: '/config/notifications.txt'
regulation:
  max_retries: 5
  find_time: '2m'
  ban_time: '5m'
