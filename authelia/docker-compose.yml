services:
  authelia:
    image: authelia/authelia:4.39
    container_name: sentinel-authelia
    restart: unless-stopped
    env_file:
      - /etc/sentinel/authelia.env
    extra_hosts:
      - "fenix.pinguinoseguro.cl:10.88.0.1"
    volumes:
      - ./config:/config
    ports:
      - "10.88.0.1:9091:9091"
    networks:
      - n8n_n8n_public

networks:
  n8n_n8n_public:
    external: true
