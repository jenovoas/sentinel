version: '3.8'
services:
  # ============================================
  # PRODUCTION SOC ENVIRONMENT - Sentinel Armor
  # ============================================

  # Core Sentinel OS Component (Running inside VM or as privileged sidecar)
  sentinel-os:
    image: jenovoas/sentinel-os:v2.8.0
    privileged: true
    container_name: sentinel-guardian
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /tmp/sentinel_cortex.sock:/tmp/sentinel_cortex.sock
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: unless-stopped

  # Cortex Bridge - The Neural Relay
  cortex-bridge:
    build:
      context: ./sentinel_core/brain
      dockerfile: Dockerfile
    container_name: sentinel-cortex-relay
    environment:
      - N8N_THREAT_WEBHOOK=${N8N_THREAT_WEBHOOK}
      - SOCKET_PATH=/tmp/sentinel_cortex.sock
    volumes:
      - /tmp/sentinel_cortex.sock:/tmp/sentinel_cortex.sock
      - ./forensics:/home/jnovoas/sentinel/forensics
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Database - Persistent Forensics
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres-prod
    environment:
      - POSTGRES_DB=sentinel_prod
      - POSTGRES_USER=sentinel_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    restart: unless-stopped

volumes:
  postgres_prod_data:
    driver: local
