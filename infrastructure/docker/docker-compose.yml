services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_default_secure_pass}
      POSTGRES_DB: sentinel_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - sentinel-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sentinel_user" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - sentinel-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile
    container_name: sentinel-vault-backend
    ports:
      - "8000:8000"
    volumes:
      - ../../src/backend:/app
      - vault_data:/app/storage
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:${POSTGRES_PASSWORD:-sentinel_default_secure_pass}@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - sentinel-net
    security_opt:
      - "seccomp=./seccomp/app-hardened.json"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ../../src/frontend
      dockerfile: Dockerfile
    container_name: sentinel-vault-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - sentinel-net

  # Nginx Reverse Proxy
  nginx:
    image: nginx:stable-alpine
    container_name: sentinel-vault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sentinel-net

  # Node Exporter for Hardware and Kernel Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sentinel-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.perf'
      - '--collector.perf.cpus=0-7'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro,rslave'
    cap_add:
      - SYS_ADMIN
    networks:
      - sentinel-net

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./configuration/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sentinel-net
    depends_on:
      - node-exporter

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: sentinel-loki
    ports:
      - "127.0.0.1:3100:3100"
      - "7946:7946"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./configuration/loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - sentinel-net

  # Promtail - Log Shipping
  promtail:
    image: grafana/promtail:latest
    container_name: sentinel-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configuration/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - sentinel-net

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sentinel_secure
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configuration/grafana/provisioning:/etc/grafana/provisioning
      - ./configuration/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vault_data:
  grafana_data:
  prometheus_data:


