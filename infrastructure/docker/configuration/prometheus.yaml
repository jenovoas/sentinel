global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['sentinel-node-exporter:9100']
  
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'docker'
    # Uses Docker's internal DNS to find containers if they expose metrics
    static_configs:
      - targets: ['host.docker.internal:9323'] 
