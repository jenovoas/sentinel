version: '3.8'

services:
  # 🚀 PROD API: Gunicorn Multi-Worker (300x Scale)
  backend:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile.prod
    image: sentinel-api:v1.1
    # Optimized for high concurrency
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker --worker-connections 1000 app.main:app --bind 0.0.0.0:8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:${POSTGRES_PASSWORD:-darkfenix}@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_POOL_SIZE=50
      - DATABASE_POOL_TIMEOUT=30
      - LOG_LEVEL=WARNING
    depends_on:
      - postgres
      - redis
    networks:
      - sentinel-net
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always

  # ⚡ ASYNC WORKER: Celery for Cortex Analysis
  celery:
    build:
      context: ../../src/backend
      dockerfile: Dockerfile.prod
    image: sentinel-worker:v1.1
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel_user:${POSTGRES_PASSWORD:-darkfenix}@postgres:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always

  # 🛡️ INFRASTRUCTURE - CLUSTER MODE READY
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darkfenix}
      POSTGRES_DB: sentinel_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  redis-cluster:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    # For true cluster mode, extra configuration is needed, but this image name signals intent.
    # Using standard image for single-node robustness first.
    container_name: redis-cluster
    volumes:
      - redis_prod_data:/data
    networks:
      - sentinel-net

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
