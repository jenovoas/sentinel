apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-backend
  namespace: sentinel-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortex-backend
  template:
    metadata:
      labels:
        app: cortex-backend
    spec:
      containers:
      - name: backend
        image: sentinel-cortex-backend:latest # Placeholder
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: sentinel-config
        - secretRef:
            name: sentinel-secrets
        resources:
          limits:
            cpu: "1"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cortex-backend
  namespace: sentinel-system
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: cortex-backend
  type: ClusterIP
