apiVersion: apps/v1
kind: Deployment
metadata:
  name: truthsync-edge
  namespace: sentinel-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: truthsync-edge
  template:
    metadata:
      labels:
        app: truthsync-edge
    spec:
      containers:
      - name: truthsync-edge
        image: sentinel-truthsync-edge:latest
        ports:
        - containerPort: 8001
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        healthCheck: # Note: K8s uses readinessProbe/livenessProbe
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: truthsync-edge
  namespace: sentinel-system
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: truthsync-edge
  type: ClusterIP
