apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-ingress
  namespace: sentinel-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: sentinel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sentinel-frontend
            port:
              number: 80
  - host: api.sentinel.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cortex-backend
            port:
              number: 8000
