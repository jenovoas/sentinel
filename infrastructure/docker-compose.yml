version: '3.8'

services:
  sentinel_db:
    image: pgvector/pgvector:pg16
    container_name: sentinel_db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_trust
      POSTGRES_DB: sentinel_core
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentinel_redis:
    image: redis:alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  sentinel_pgdata:
