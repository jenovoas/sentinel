name: cleanup_logs
description: "Limpia logs antiguos del sistema para liberar espacio en disco."
risk_level: low
steps:
  - name: check_log_size
    cmd: "du -sh /var/log"
    
  - name: rotate_system_logs
    cmd: "sudo journalctl --vacuum-time=7d"
    
  - name: clean_sentinel_logs
    cmd: "find /var/log/sentinel -name '*.log' -mtime +7 -delete"
    
  - name: verify_space_freed
    cmd: "df -h /var/log"

rollback:
  - cmd: "echo 'No rollback needed for log cleanup'"
