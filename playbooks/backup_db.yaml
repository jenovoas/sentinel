name: backup_critical_db
description: "Realiza un backup completo de la base de datos PostgreSQL crítica."
risk_level: low
steps:
  - name: verify_disk_space
    cmd: "df -h /var/backups | awk 'NR==2 {if ($4 < 10) exit 1}'"
    failure_msg: "Espacio insuficiente en disco para backup."
    
  - name: dump_database
    cmd: "sdocker exec postgres pg_dump -U sentinel db > /var/backups/sentinel_db_$(date +%Y%m%d).sql"
    
  - name: compress_artifact
    cmd: "gzip /var/backups/sentinel_db_*.sql"
    
  - name: verify_integrity
    cmd: "gzip -t /var/backups/sentinel_db_*.gz"

rollback:
  - cmd: "rm -f /var/backups/sentinel_db_$(date +%Y%m%d).sql"
