[package]
name = "init"
version = "0.1.0"
edition = "2024"

[dependencies]
aya = "0.13"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.28", features = ["signal", "process", "mount"] }
rlimit = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
procfs = "0.16"
aho-corasick = "1.1"
memmap2 = "0.9"
pqcrypto-traits = "0.3.5"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
