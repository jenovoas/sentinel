[package]
name = "forensics"
version = "1.2.0"
edition = "2024"

[dependencies]
aya = { version = "0.13.1", features = ["async_tokio"] }
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
procfs = "0.16.0"
futures = "0.3"
rustc-hash = "1.1"
dashmap = "5.5"
aho-corasick = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-stream = "0.1"
bytes = "1.4"
forensics-common = { path = "./forensics-common", features = ["user"] }
