[package]
name = "sentinel-cortex"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "sentinel_cortex"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Web server
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-native-tls", "macros", "migrate"] }
redis = { version = "0.32", features = ["tokio-comp"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4.38", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Crypto
sha3 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Lazy static initialization
lazy_static = "1.4"

# Terminal UI
ratatui = "0.30.2"
crossterm = { version = "0.27", features = ["events"] }
rustyline = "12.0"
rustyline-derive = "0.10"
libbpf-rs = "0.24"
libc = "0.2"
futures-util = "0.3"
me60os_core = { path = "../me-60os-core", package = "me60os", default-features = false }
truthsync_core = { path = "../truthsync-core", package = "truthsync-core" }

[dev-dependencies]
tokio-test = "0.4"

[lints.clippy]
float_arithmetic = "forbid"
float_cmp = "forbid"
cast_possible_truncation = "forbid"
cast_precision_loss = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
