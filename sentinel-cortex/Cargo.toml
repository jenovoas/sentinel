[package]
name = "sentinel-cortex"
version = "0.1.0"
edition = "2021"

[lib]
name = "sentinel_cortex"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Web server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls"] }
redis = { version = "0.32", features = ["tokio-comp"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Crypto
sha3 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Lazy static initialization
lazy_static = "1.4"

# eBPF Bridge
# Terminal UI
rustyline = "12.0"
rustyline-derive = "0.10"
libbpf-rs = "0.24"
libc = "0.2"
me60os_core = { path = "../../ME-60OS", package = "me60os" }

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
