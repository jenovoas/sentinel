# Sentinel daily recovery schedule — install exactly once, as the SSH operator.
# Substitute verified absolute paths; this is a template, not a root cron file.
# Before installation inspect user/root crontabs, /etc/cron.d and systemd timers.
# Enable only after recovery.py reports restore_verified=true from a Kingu round-trip.
# Cron uses the host timezone (Fenix currently Etc/UTC); next run is 03:00 UTC.
# recovery.py takes an exclusive lock; failed backup/copy/restore exits nonzero.
# The operator must retain Docker access and the existing SSH/WireGuard identity.
# No password, SSH private key, or customer content belongs in this file.
# No automatic retention deletion is enabled by the recovery workflow.
#
# 0 3 * * * umask 077; /usr/bin/python3 @REPO_ROOT@/scripts/backup/recovery.py --config @RECOVERY_CONFIG@ >> @BACKUP_DIR@/scheduler.log 2>&1 # sentinel-postgres-recovery-daily
