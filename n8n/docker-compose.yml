services:
  n8n:
    image: n8nio/n8n:1.41.0
    container_name: sentinel-n8n
    restart: unless-stopped
    env_file:
      - /etc/sentinel/n8n.env
    ports:
      - "10.88.0.1:5678:5678"
    volumes:
      - sentinel_n8n_data:/home/node/.n8n
    networks:
      - sentinel_sentinel_internal
      - n8n_public

networks:
  sentinel_sentinel_internal:
    external: true
  n8n_public:
    driver: bridge

volumes:
  sentinel_n8n_data:
    external: true
