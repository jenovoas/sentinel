[workspace]
members = [
    "services/neural-guard",
    "sentinel-cortex",
    "me-60os-core",
    "truthsync-core",
    "sentinel-verifier",
]
resolver = "2"

[workspace.lints.clippy]
float_arithmetic = "forbid"
float_cmp = "forbid"
cast_precision_loss = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
