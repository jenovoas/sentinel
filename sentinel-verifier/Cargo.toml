[package]
name = "sentinel-verifier"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Sentinel-NonCommercial"
description = "Automated invariant verifier for Sentinel stack on Fan"
authors = ["Jaime Novoa Sepúlveda"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
me60os_core = { path = "../me-60os-core", package = "me60os" }

[build-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
toml = "0.8"

[[bin]]
name = "sentinel-verifier"
path = "src/main.rs"
