[package]
name = "sentinel-verifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Automated invariant verifier for Sentinel stack on Fan"
authors = ["Jaime Novoa Sepúlveda"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "sentinel-verifier"
path = "src/main.rs"
