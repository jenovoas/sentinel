[package]
name = "forensics"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
aya = { git = "https://github.com/aya-rs/aya", features = ["async_tokio"] }
procfs = "0.16"
rayon = "1.8"
rustc-hash = "1.1"
aho-corasick = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
forensics-common = { path = "./forensics-common", features = ["user"] }
